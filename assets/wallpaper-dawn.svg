<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6873"/>
      <stop offset=".48" stop-color="#91a5a4"/>
      <stop offset=".76" stop-color="#dfc2a7"/>
      <stop offset="1" stop-color="#e7c9ad"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4d5" stop-opacity=".96"/>
      <stop offset=".24" stop-color="#f8d7ad" stop-opacity=".75"/>
      <stop offset=".64" stop-color="#eead7d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#e6a171" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeBack" x1=".1" y1=".2" x2=".8" y2="1">
      <stop offset="0" stop-color="#667d78"/>
      <stop offset="1" stop-color="#3f5d5b"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1=".15" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#8a9a82"/>
      <stop offset=".56" stop-color="#687d6d"/>
      <stop offset="1" stop-color="#465f59"/>
    </linearGradient>
    <linearGradient id="field" x1=".15" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#c8b998"/>
      <stop offset=".4" stop-color="#8f9277"/>
      <stop offset="1" stop-color="#4d675d"/>
    </linearGradient>
    <linearGradient id="foreground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#384f4d"/>
      <stop offset=".62" stop-color="#5e7265"/>
      <stop offset="1" stop-color="#314947"/>
    </linearGradient>
    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="softenSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="47%" r="78%">
      <stop offset=".55" stop-color="#0e1b1b" stop-opacity="0"/>
      <stop offset="1" stop-color="#0e1b1b" stop-opacity=".32"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1200" fill="url(#sky)"/>
  <rect width="1920" height="1200" fill="url(#vignette)"/>
  <circle cx="1370" cy="454" r="410" fill="url(#sun)"/>

  <g fill="#f2e2d2" filter="url(#soften)">
    <ellipse cx="310" cy="323" rx="330" ry="69" opacity=".20"/>
    <ellipse cx="530" cy="356" rx="245" ry="42" opacity=".14"/>
    <ellipse cx="1550" cy="252" rx="320" ry="55" opacity=".2"/>
    <ellipse cx="1526" cy="584" rx="370" ry="74" opacity=".16"/>
  </g>

  <path d="M0 744C151 699 251 702 393 735c159 37 274 4 417-34 180-48 278 16 430 37 152 21 281 4 380-26 91-28 184-42 300-19v507H0Z" fill="#718781" opacity=".45"/>
  <path d="M-80 815c222-84 397-97 595-40 189 55 344 28 514-33 195-70 376-69 576 4 129 47 232 40 395-11v465H-80Z" fill="url(#ridgeBack)"/>

  <path d="M-70 918c170-116 314-133 475-69 117 47 199 51 310 11 111-40 235-52 377-16 141 37 272 90 470 34 153-43 266-26 428 44v278H-70Z" fill="url(#ridgeMid)" filter="url(#softenSmall)"/>
  <path d="M-80 1002c214-102 404-88 608-27 204 60 367 13 551-37 184-49 368-52 542 11 127 47 217 43 369-8v259H-80Z" fill="url(#field)" opacity=".92"/>
  <path d="M-50 1119c194-97 356-83 542-36 186 46 341 53 510 20 188-37 361-58 542-2 155 48 273 31 456-22v121H-50Z" fill="url(#foreground)"/>

  <g fill="none" stroke="#e9d7b8" stroke-linecap="round">
    <path d="M934 831c161-42 308-31 475 12" stroke-width="1.3" opacity=".18"/>
    <path d="M712 901c222-65 457-55 688 4" stroke-width="1.1" opacity=".17"/>
    <path d="M1092 702c121-24 217-12 327 18" stroke-width="1" opacity=".16"/>
  </g>

  <rect width="1920" height="1200" filter="url(#grain)" opacity=".65"/>
</svg>
