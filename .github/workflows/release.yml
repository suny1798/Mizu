name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check extension
        run: python3 scripts/package.py --check

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify tag and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/package.py --tag "$RELEASE_TAG"
          test -f "release-notes/${RELEASE_TAG#v}.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/mizu-start-${RELEASE_TAG}.zip" \
            "dist/mizu-start-${RELEASE_TAG}.zip.sha256" \
            --verify-tag \
            --title "Mizu ${RELEASE_TAG}" \
            --notes-file "release-notes/${RELEASE_TAG#v}.md"
